# Configuración central del proyecto. Todas las rutas son relativas a la raíz del repositorio.

project:
  name: prediccion-burnout-organizacional
  seed: 42

paths:
  raw_data: data/raw/train.csv
  processed_data: data/processed/burnout_clean.csv
  models_dir: models
  best_model: models/best_model.pkl
  model_v1: models/model_v1.pkl
  best_params: models/best_params.json
  figures_dir: results/figures
  metrics_dir: results/metrics
  reports_dir: results/reports

data:
  target: Burn Rate
  id_columns: [Employee ID, Date of Joining]
  # Gender se conserva en los datos solo para auditar equidad; no entra al modelo final.
  sensitive_columns: [Gender]
  numeric_features: [Designation, Resource Allocation, Mental Fatigue Score]
  categorical_features: [Company Type, WFH Setup Available]
  test_size: 0.20

alert:
  # Definición de riesgo alto: Burn Rate real mayor o igual a este valor.
  threshold: 0.60
  # Sensibilidad mínima exigida a la alerta (KPI del proyecto). El corte de
  # decisión sobre la predicción se calibra con validación cruzada en train.
  min_recall: 0.85

model:
  # Hiperparámetros finales seleccionados con Optuna (ver docs/optimizacion.md).
  params:
    n_estimators: 642
    learning_rate: 0.0185
    max_depth: 5
    min_child_weight: 3.59
    subsample: 0.532
    colsample_bytree: 0.975
    reg_lambda: 0.194
    reg_alpha: 0.0059
  # Nivel de cobertura de los intervalos de predicción conformales.
  interval_coverage: 0.90
  cv_folds: 5

optimization:
  n_trials: 60
  cv_folds: 5

privacy:
  # Tamaño mínimo de un segmento para mostrar resultados agregados (k-anonimato).
  min_group_size: 10
